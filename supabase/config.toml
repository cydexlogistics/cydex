# Only names the local development stack. Which hosted project the CLI talks to
# is set by `supabase link --project-ref <project-ref>` (kept in supabase/.temp, not committed).
project_id = "cydex"

# Squad calls this directly; it checks the Squad signature instead of a Supabase login
[functions.squad-webhook]
verify_jwt = false

# Called by pg_cron with the x-cron-secret header
[functions.send-emails]
verify_jwt = false

# Called by the database for each new notification; reads only the notification id
[functions.send-push]
verify_jwt = false

# Called by signed-in users (the function checks their login itself) and by
# pg_cron for the 10-minute status sweep (checked with x-cron-secret)
[functions.squad-payout]
verify_jwt = false
